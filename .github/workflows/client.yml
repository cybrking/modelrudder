name: Community client
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        node: [24, 26]
        os: [macos-latest, ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Isolate managed native installations
        run: node -e "require('node:fs').appendFileSync(process.env.GITHUB_ENV, 'SMART_CODEX_STATE_DIR=' + require('node:path').join(process.env.RUNNER_TEMP, 'modelrudder-native') + '\n')"
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm test
      - name: Advisory behavior evaluation
        run: npm run eval:advisory
      - name: Install isolated Codex for advisory hook qualification
        run: npm install --prefix "${{ runner.temp }}/modelrudder-advisory-codex" --ignore-scripts --no-audit --no-fund @openai/codex@0.164.0
      - name: Native advisory hook discovery and note (synthetic, no inference)
        run: npm run test:advisory-native -- "${{ runner.temp }}/modelrudder-advisory-codex/node_modules/@openai/codex/bin/codex.js"
      - name: Install and verify managed Codex (no inference)
        run: node --input-type=module -e "import { launchSmartCodex } from './src/smart-codex.ts'; process.exitCode = await launchSmartCodex(['native', 'install']);"
      - run: node src/smart-codex.ts native status
      - name: Reuse managed Codex installation
        run: node --input-type=module -e "import { launchSmartCodex } from './src/smart-codex.ts'; process.exitCode = await launchSmartCodex(['native', 'install']);"
      - name: Install and verify managed Claude (synthetic provider)
        run: node --input-type=module -e "import { launchSmartClaude } from './src/smart-claude.ts'; process.exitCode = await launchSmartClaude(['native', 'install']);"
      - run: node src/smart-claude.ts native status
      - name: Reuse managed Claude installation
        run: node --input-type=module -e "import { launchSmartClaude } from './src/smart-claude.ts'; process.exitCode = await launchSmartClaude(['native', 'install']);"
      - run: npm audit --omit=dev
      - run: npm run package:release -- dist-release.json
      - run: npm run package:pilot -- dist/delivery
      - uses: actions/upload-artifact@v4
        with:
          name: modelrudder-${{ matrix.os }}-node-${{ matrix.node }}
          path: |
            dist-release.json
            dist/delivery/
          retention-days: 7
