name: Community client
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        node: [24, 26]
        os: [macos-latest, ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm test
      - run: npm install --global @openai/codex@0.160.1
      - run: npm run test:native-protocol
      - run: npm audit --omit=dev
      - run: npm run package:release -- dist-release.json
      - run: npm run package:pilot -- dist/delivery
      - uses: actions/upload-artifact@v4
        with:
          name: modelrudder-${{ matrix.os }}-node-${{ matrix.node }}
          path: |
            dist-release.json
            dist/delivery/
          retention-days: 7
